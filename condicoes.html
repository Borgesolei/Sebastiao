<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Condições</title>
        <script>
            let contador = 1
            const qtd= prompt('quantas notas? ')
            let soma = 0
            let nota = 0
            while(contador <= qtd){
                nota = Number(prompt('digite a nota ' + contador))

            do{ 
                nota = Number(prompt('Digite a nota ' + contador))   
            }while(nota>10)

            soma = soma + nota
            contador++
            }
            console.log('Soma: ' + soma)
            console.log('Nota: ' + nota)
        </script>
